
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новогодняя AR-карта</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #card {
      display: none;
      position: fixed;
      z-index: 1000;
      bottom: 24px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 40px #0004;
    }
    #card a { color: #bb303a; }
    #close { float: right; cursor: pointer; }
  </style>
</head>
<body>

  <div id="card">
    <button id="close" aria-label="Закрыть">✕</button>
    <h2 id="project-title"></h2>
    <p id="project-description"></p>
    <a id="project-link" href="#">Подробнее →</a>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse"
      raycaster="objects: .clickable">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-circle class="clickable"
        data-project="ice"
        position="-0.346 -0.009 0.03"
        radius="0.055"
        color="#3678C5"
        opacity="0.85">
      </a-circle>

      <a-circle class="clickable"
        data-project="gift"
        position="0.146 0.145 0.03"
        radius="0.055"
        color="#C53642"
        opacity="0.85">
      </a-circle>

      <a-circle class="clickable"
        data-project="light"
        position="0.030 -0.197 0.03"
        radius="0.055"
        color="#96509E"
        opacity="0.85">
      </a-circle>

    </a-entity>
  </a-scene>

  <script>
    const projects = {
      ice: {
        title: "Каток в городе",
        description: "Локации и праздничные события",
        url: "/projects/ice"
      },
      gift: {
        title: "Подарки с историей",
        description: "Истории новогодних подарков",
        url: "/projects/gift"
      },
      light: {
        title: "Свет праздника",
        description: "Инсталляции и праздничные маршруты",
        url: "/projects/light"
      }
    };

    document.querySelectorAll("[data-project]")
      .forEach(marker => {
        marker.addEventListener("click", () => {
          const p = projects[marker.dataset.project];
          document.querySelector("#project-title").textContent = p.title;
          document.querySelector("#project-description").textContent = p.description;
          document.querySelector("#project-link").href = p.url;
          document.querySelector("#card").style.display = "block";
        });
      });

    document.querySelector("#close").onclick = () => {
      document.querySelector("#card").style.display = "none";
    };
  </script>

</body>
</html>
