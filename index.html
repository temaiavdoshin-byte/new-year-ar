<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Магия искусства — AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120b16;color:white;font-family:system-ui,-apple-system,sans-serif}a-scene{position:fixed!important;inset:0;width:100%!important;height:100dvh!important;background:transparent!important;z-index:2}a-scene canvas{background:transparent!important}.a-enter-vr,.a-enter-ar,.a-orientation-modal{display:none!important}#ui{position:fixed;inset:0;z-index:30;pointer-events:none}.top{position:absolute;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.status,.message{border:1px solid #d9a86c70;background:#170f19d9;backdrop-filter:blur(12px);padding:10px 14px;border-radius:15px;font-size:13px}.status small{display:block;color:#e9ceb2;font-size:11px;margin-top:4px}.message{text-align:center;max-width:440px}button{pointer-events:auto;background:#812b2e;color:white;border:1px solid #f3bd7a77;border-radius:13px;padding:11px 14px;touch-action:manipulation}.bottom{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:9px}#replay{display:none}
</style></head><body>
<a-scene id="scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: no" embedded color-space="sRGB" renderer="colorManagement: true; alpha: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity></a-scene>
<div id="ui"><div class="top"><div class="status"><strong id="state">Загружаем магию…</strong><small id="detail">Проверяем AR-маркер</small></div><button id="retry">↻</button></div><div class="bottom"><div class="message" id="message">Наведите камеру на весь постер «Машина искусства»</div><button id="replay">✨ Повторить волшебство</button></div></div>
<script>
(()=>{'use strict';const scene=document.getElementById('scene'),target=document.getElementById('target'),state=document.getElementById('state'),detail=document.getElementById('detail'),message=document.getElementById('message'),replay=document.getElementById('replay');
const W=800,H=1313; // physical poster width/height: 1185/1945
const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');let found=false,start=performance.now(),texture=null,mesh=null,lastFrame=0;
function status(a,b){state.textContent=a;detail.textContent=b}
function fixCamera(){if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.domElement.style.background='transparent'}document.querySelectorAll('video').forEach(v=>{v.style.setProperty('visibility','visible','important');v.style.setProperty('opacity','1','important')})}
function init(){if(mesh)return;texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;const mat=new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false});mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,H/W),mat);mesh.position.z=.025;mesh.renderOrder=100;target.object3D.add(mesh)}
const P=(x,y)=>[x/992*W,y/1537*H];
// Test animation path: adjust bends after aligning against the photographed poster.
const segments=[[[432,222],[578,214],[662,301],[582,405]],[[582,405],[450,440],[327,480],[355,562]],[[355,562],[400,647],[685,720],[625,852]],[[625,852],[530,954],[228,930],[263,1035]],[[263,1035],[344,1128],[546,1124],[690,1112]]];
function bez(s,t){const p=s.map(v=>P(...v)),k=1-t;return [k*k*k*p[0][0]+3*k*k*t*p[1][0]+3*k*t*t*p[2][0]+t*t*t*p[3][0],k*k*k*p[0][1]+3*k*k*t*p[1][1]+3*k*t*t*p[2][1]+t*t*t*p[3][1]]}
function point(u){const q=Math.min(.999999,Math.max(0,u))*segments.length;return bez(segments[Math.floor(q)],q-Math.floor(q))}
function glow(x,y,r,power){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,245,192,'+power+')');g.addColorStop(.2,'rgba(255,189,80,'+(power*.5)+')');g.addColorStop(1,'rgba(255,191,80,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function gear(x,y,r,a,alpha){[x,y]=P(x,y);r=r/992*W;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=alpha;ctx.shadowColor='#ffc46e';ctx.shadowBlur=15;ctx.strokeStyle='#ffc46e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();for(let i=0;i<12;i++){const q=i*Math.PI/6;ctx.beginPath();ctx.moveTo(Math.cos(q)*r*.85,Math.sin(q)*r*.85);ctx.lineTo(Math.cos(q)*r*1.18,Math.sin(q)*r*1.18);ctx.stroke()}ctx.beginPath();ctx.arc(0,0,r*.2,0,Math.PI*2);ctx.stroke();ctx.restore()}
function render(now){const e=(now-start)/1000,motion=e<12?e/12:((e-12)*.07)%1;ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='screen';ctx.save();ctx.strokeStyle='rgba(255,189,76,.40)';ctx.lineWidth=3;ctx.shadowBlur=17;ctx.shadowColor='#ffb94d';ctx.beginPath();for(let i=0;i<=150;i++){const [x,y]=point(i/150);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.restore();for(let i=0;i<75;i++){const u=i/74;if(e<12&&u>e/9)continue;const [x,y]=point(u),pulse=.5+.5*Math.sin(now*.004-i*.42);glow(x,y,10+6*pulse,.12+.2*pulse);ctx.fillStyle='rgba(255,240,178,'+(.3+.65*pulse)+')';ctx.beginPath();ctx.arc(x,y,1.7+1.3*pulse,0,Math.PI*2);ctx.fill()}for(let j=14;j>=0;j--){const u=(motion-j*.006+1)%1;const [x,y]=point(u);glow(x,y,j===0?29:15,Math.max(.1,.6-j*.03))}const [bx,by]=point(motion);ctx.save();ctx.shadowBlur=17;ctx.shadowColor='#ffe19a';ctx.fillStyle='#d72c24';ctx.beginPath();ctx.arc(bx,by,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffebbd';ctx.beginPath();ctx.arc(bx-3,by-3,3,0,Math.PI*2);ctx.fill();ctx.restore();if(e>3){const a=Math.min(1,(e-3)/2)*.65;gear(467,1030,41,e*.42,a);gear(523,868,34,-e*.55,a)}[[304,373],[607,301],[704,686],[746,798],[638,1020]].forEach((p,i)=>{if(e<5+i*.35)return;const [x,y]=P(...p);glow(x,y,27+10*Math.sin(e*2+i)**2,.12+.07*Math.sin(e*2+i)**2)});for(let i=0;i<38;i++){if(e<1+i*.07)continue;const x=(Math.sin(i*73.1)*.5+.5)*W*.78+W*.10,y=(Math.sin(i*31.7)*.5+.5)*H*.69+H*.15,k=(1+Math.sin(e*2.6+i*1.9))/2;glow(x,y,7+5*k,.05+.13*k);if(k>.8){ctx.save();ctx.globalAlpha=k*.6;ctx.strokeStyle='#ffe4b0';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+3,y);ctx.moveTo(x,y-3);ctx.lineTo(x,y+3);ctx.stroke();ctx.restore()}}ctx.globalCompositeOperation='source-over';texture.needsUpdate=true}
function tick(t){requestAnimationFrame(tick);if(!found||!texture||t-lastFrame<33)return;lastFrame=t;render(t)}
scene.addEventListener('renderstart',()=>{fixCamera();init()});scene.addEventListener('arReady',()=>{fixCamera();init();status('Камера готова','Наведите её на новый постер')});scene.addEventListener('arError',()=>status('Ошибка AR','Проверьте доступ к камере'));
target.addEventListener('targetFound',()=>{found=true;fixCamera();init();start=performance.now();status('Постер найден ✨','Магия искусства пробуждается');message.textContent='Волшебный механизм оживает';replay.style.display='block'});
target.addEventListener('targetLost',()=>{found=false;status('Ищем постер','Верните изображение в кадр');message.textContent='Наведите камеру на весь постер';replay.style.display='none'});
replay.onclick=()=>{start=performance.now();message.textContent='Волшебство начинается ✨'};document.getElementById('retry').onclick=()=>location.reload();
fetch('./targets.mind',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.arrayBuffer()}).then(b=>{if(b.byteLength<1000)throw Error('Файл слишком мал');if(!found)status('AR загружается','Маркер: '+Math.round(b.byteLength/1024)+' КБ')}).catch(e=>status('Ошибка targets.mind',e.message));requestAnimationFrame(tick);setTimeout(fixCamera,1500);setTimeout(fixCamera,3500);
})();
</script></body></html>
