<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160d13">
  <title>Магия искусства — AR 2.0</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    /* IMPORTANT: MindAR creates its camera video dynamically. It must not sit behind the body. */
    body { background: transparent !important; }
    body > video, video {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100dvh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    a-scene, #ar-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important; height: 100dvh !important;
      z-index: 1 !important;
      background: transparent !important;
    }
    a-scene canvas, canvas.a-canvas {
      background: transparent !important;
    }
    .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }
    #ui { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
    #top { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    #status { padding: 11px 14px; max-width: 75%; border: 1px solid #e1b87d88; border-radius: 16px; background: #251319d9; backdrop-filter: blur(12px); font-size: 13px; }
    #status small { display: block; margin-top: 4px; color: #f6d6af; font-size: 11px; }
    button { cursor: pointer; pointer-events: auto; touch-action: manipulation; border-radius: 13px; color: #fff; border: 1px solid #e7b77c88; padding: 11px 15px; background: #8f2930; font: inherit; }
    #bottom { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 14px; right: 14px; display: grid; justify-items: center; gap: 10px; }
    #hint { max-width: 400px; padding: 11px 16px; text-align: center; font-size: 13px; background: #251319dc; border: 1px solid #e1b87d88; border-radius: 14px; }
    #replay { display: none; background:rgba(100,39,40,.77); padding:9px 13px; font-size:12px; }
    #status { transition: opacity .7s ease, transform .7s ease; }
    #status.minimized { opacity:.74; transform:scale(.86); transform-origin:top left; }
    #status.minimized small { display:none; }
    #hint { transition: opacity .8s ease; }
    #hint.quiet { opacity:0; }
    @media (prefers-reduced-motion:reduce) { #status,#hint { transition:none; } }
  </style>
</head>
<body>
  <a-scene id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: no;"
    embedded color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="poster" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <div id="ui">
    <div id="top">
      <div id="status"><strong id="status-title">Подготовка AR…</strong><small id="status-detail">Проверяем камеру и маркер</small></div>
      <button id="restart" type="button" aria-label="Перезапустить">↻</button>
    </div>
    <div id="bottom">
      <div id="hint">Наведите телефон на весь постер «Машина искусства»</div>
      <button id="replay" type="button">✨ Повторить волшебство</button>
    </div>
  </div>

  <script>
  (() => {
    'use strict';
    const scene = document.getElementById('ar-scene');
    const poster = document.getElementById('poster');
    const title = document.getElementById('status-title');
    const detail = document.getElementById('status-detail');
    const hint = document.getElementById('hint');
    const replay = document.getElementById('replay');
    const W = 800, H = 1313; // aspect ratio of the compiled image, about 1185:1945
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    let texture, plane, tracking = false, start = 0, lastFrame = 0;

    const setStatus = (a, b) => { title.textContent = a; detail.textContent = b; };

    function fixVideo() {
      // MindAR often inserts video with a negative z-index; on iOS that can hide it behind the page.
      document.querySelectorAll('video').forEach(video => {
        video.style.setProperty('z-index', '0', 'important');
        video.style.setProperty('visibility', 'visible', 'important');
        video.style.setProperty('opacity', '1', 'important');
      });
      if (scene.renderer) {
        scene.renderer.setClearColor(0x000000, 0);
        scene.renderer.setClearAlpha(0);
        scene.renderer.domElement.style.setProperty('background', 'transparent', 'important');
      }
      if (scene.object3D) scene.object3D.background = null;
    }

    function initVisuals() {
      if (plane || !window.THREE) return;
      texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      const material = new THREE.MeshBasicMaterial({
        map: texture, transparent: true, depthWrite: false,
        side: THREE.DoubleSide, toneMapped: false
      });
      plane = new THREE.Mesh(new THREE.PlaneGeometry(1, H / W), material);
      plane.position.z = 0.025;
      plane.renderOrder = 10;
      poster.object3D.add(plane);
    }

    // AR 2.0: approximate centerline of the transparent glass track.
    // Coordinates are in the ORIGINAL poster's 992 x 1537 pixel space.
    // Edit these points after comparing the overlay with the printed artwork.
    const trackPoints = [
      [426,227],[479,231],[549,255],[577,308],[553,357],
      [487,402],[400,430],[350,475],[338,522],[372,573],
      [459,621],[560,670],[611,726],[585,773],[515,815],
      [416,856],[316,908],[294,961],[346,1006],
      [432,1031],[530,1005],[607,968],[644,932],
      [624,980],[547,1031],[444,1063],[342,1074],
      [289,1090],[330,1126],[442,1138],[553,1131],[668,1129]
    ];
    const pt = (x,y) => [x / 992 * W, y / 1537 * H];
    function catmull(a,b,c,d,u) {
      return .5*((2*b)+(-a+c)*u+(2*a-5*b+4*c-d)*u*u+(-a+3*b-3*c+d)*u*u*u);
    }
    // Sample the spline and reparameterize by arc length so the ball moves smoothly.
    const samples=[]; let totalLength=0;
    for(let i=0;i<trackPoints.length-1;i++) {
      for(let j=0;j<18;j++) {
        const u=j/18, A=trackPoints[Math.max(i-1,0)],B=trackPoints[i],
          C=trackPoints[i+1],D=trackPoints[Math.min(i+2,trackPoints.length-1)];
        const x=catmull(A[0],B[0],C[0],D[0],u),y=catmull(A[1],B[1],C[1],D[1],u);
        const xy=pt(x,y);
        if(samples.length){const q=samples[samples.length-1];totalLength+=Math.hypot(q.x-xy[0],q.y-xy[1]);}
        samples.push({x:xy[0],y:xy[1],distance:totalLength});
      }
    }
    const last=pt(...trackPoints[trackPoints.length-1]);
    totalLength+=Math.hypot(last[0]-samples[samples.length-1].x,last[1]-samples[samples.length-1].y);
    samples.push({x:last[0],y:last[1],distance:totalLength});
    function path(u){
      const d=Math.max(0,Math.min(1,u))*totalLength;
      let lo=0,hi=samples.length-1;
      while(lo<hi){let mid=(lo+hi)>>1;if(samples[mid].distance<d)lo=mid+1;else hi=mid;}
      if(lo===0)return [samples[0].x,samples[0].y];
      const a=samples[lo-1],b=samples[lo],f=(d-a.distance)/Math.max(.0001,b.distance-a.distance);
      return [a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f];
    }
    function glow(x, y, r, strength, rgb='255,184,79') {
      const gradient = ctx.createRadialGradient(x,y,0,x,y,r);
      gradient.addColorStop(0, `rgba(255,249,206,${strength})`);
      gradient.addColorStop(.25, `rgba(${rgb},${strength*.5})`);
      gradient.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    function gear(x, y, radius, angle, opacity) {
      [x,y] = pt(x,y); radius *= W / 992;
      ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.globalAlpha=opacity;
      ctx.shadowColor='#ffcb72'; ctx.shadowBlur=16;
      ctx.strokeStyle='#ffca73'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,radius,0,Math.PI*2); ctx.stroke();
      for(let i=0;i<12;i++) {
        const a=i*Math.PI/6;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*radius*.85, Math.sin(a)*radius*.85);
        ctx.lineTo(Math.cos(a)*radius*1.17, Math.sin(a)*radius*1.17);
        ctx.stroke();
      }
      ctx.restore();
    }

    function draw(now) {
      if (!tracking || !texture) return;
      const time=(now-start)/1000;
      const intro=time<12;
      const progress=intro?Math.min(1,time/11.5):((time-12)*.043)%1;
      const finale=time>=10.8 && time<=13.4;
      const burst=finale?Math.sin(Math.PI*(time-10.8)/2.6)**2:0;
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='screen';
      // A restrained gold underlight; we avoid painting over the original artwork.
      ctx.save(); ctx.strokeStyle='rgba(245,180,77,'+(.18+burst*.3)+')';
      ctx.lineWidth=1.7+burst*1.7;ctx.shadowBlur=12+burst*16;ctx.shadowColor='#ffc86c';
      ctx.beginPath();
      samples.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});
      ctx.stroke();ctx.restore();
      const lit=intro?Math.min(1,time/10.8):1;
      for(let i=0;i<92;i++){
        const u=i/91;if(u>lit)continue;
        const [x,y]=path(u),pulse=.5+.5*Math.sin(time*3.7-i*.55);
        glow(x,y,8+7*pulse+burst*7,.10+.19*pulse+burst*.13);
        ctx.fillStyle='rgba(255,235,177,'+(.3+.58*pulse)+')';
        ctx.beginPath();ctx.arc(x,y,1.2+pulse*.9,0,2*Math.PI);ctx.fill();
      }
      // Comet tail behind the moving cherry-red glass ball.
      for(let i=17;i>=0;i--){
        const u=progress-i*.004;
        if(u<0)continue;
        const [x,y]=path(u);
        glow(x,y,i===0?33:13,Math.max(.05,.55-i*.025),'255,91,43');
      }
      const [ballX,ballY]=path(progress);
      ctx.save();ctx.shadowColor='#ffd17a';ctx.shadowBlur=19+burst*22;
      ctx.fillStyle='#c3231b';ctx.beginPath();ctx.arc(ballX,ballY,8.5,0,2*Math.PI);ctx.fill();
      ctx.fillStyle='#fff0b6';ctx.beginPath();ctx.arc(ballX-2.5,ballY-3,3.2,0,2*Math.PI);ctx.fill();ctx.restore();
      if(time>3){
        const opacity=Math.min(.62,(time-3)*.28)*(1+burst*.5);
        gear(465,1030,43,time*.38,opacity);
        gear(525,866,36,-time*.53,opacity);
      }
      // Art stations light up sequentially, staying pinned to the printed composition.
      const accents=[[296,375],[612,303],[698,685],[744,807],[645,1006],[363,565]];
      accents.forEach(([x,y],i)=>{
        if(time<4+i*.8)return;
        const p=pt(x,y),pulse=.5+.5*Math.sin(time*2.1+i);
        glow(p[0],p[1],29+14*pulse+burst*27,.09+.13*pulse+burst*.2);
      });
      // Fixed stars twinkle, preserving registration to the paper.
      for(let i=0;i<38;i++){
        const x=(Math.sin(i*73.1)*.5+.5)*W*.79+W*.1;
        const y=(Math.sin(i*31.7)*.5+.5)*H*.68+H*.16;
        const pulse=(1+Math.sin(time*2.7+i*1.9))*.5;
        if(time>1+i*.06)glow(x,y,6+pulse*8+burst*7,.05+pulse*.16+burst*.14);
      }
      // Finale: a gold wave runs along the machine, then a soft halo fades away.
      if(burst>0){
        const count=45;
        for(let i=0;i<count;i++){
          const [x,y]=path(i/(count-1));
          glow(x,y,21+burst*26,burst*.36,'255,205,95');
        }
        const center=pt(480,710);
        glow(center[0],center[1],150+burst*160,burst*.14,'255,210,104');
      }
      ctx.globalCompositeOperation='source-over';
      texture.needsUpdate=true;
    }

    function loop(now) {
      requestAnimationFrame(loop);
      if (now-lastFrame<33) return;
      lastFrame=now;
      draw(now);
    }
    document.getElementById('restart').addEventListener('click',()=>location.reload());
    replay.addEventListener('click',()=>{
      start=performance.now();
      hint.classList.remove('quiet'); hint.textContent='Волшебство начинается ✨';
    });
    scene.addEventListener('renderstart',()=>{ fixVideo(); initVisuals(); });
    scene.addEventListener('arReady',()=>{
      fixVideo(); initVisuals();
      if(!tracking) setStatus('Камера готова','Наведите её на новый постер');
    });
    scene.addEventListener('arError',()=>setStatus('Ошибка AR','Проверьте разрешение камеры в Safari'));
    poster.addEventListener('targetFound',()=>{
      tracking=true; start=performance.now();
      fixVideo(); initVisuals();
      setStatus('Постер найден ✨','Магия искусства пробуждается');
      hint.textContent='Смотрите, как оживает механизм';
      document.getElementById('status').classList.remove('minimized');
      hint.classList.remove('quiet');
      setTimeout(()=>{if(tracking){document.getElementById('status').classList.add('minimized');hint.classList.add('quiet');}},2300);
      replay.style.display='block';
    });
    poster.addEventListener('targetLost',()=>{
      tracking=false;
      setStatus('Ищем постер','Верните изображение в кадр');
      hint.classList.remove('quiet');document.getElementById('status').classList.remove('minimized');
      hint.textContent='Наведите камеру на весь постер';
      replay.style.display='none';
    });
    fetch('./targets.mind',{cache:'no-store'})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();})
      .then(buf=>{if(buf.byteLength<1000)throw new Error('Некорректный маркер');
        if(!tracking)setStatus('Маркер загружен','Ожидаем камеру и изображение');})
      .catch(e=>setStatus('Ошибка targets.mind',e.message));
    requestAnimationFrame(loop);
    setTimeout(fixVideo,1300);
    setTimeout(fixVideo,3500);
  })();
  </script>
</body>
</html>
