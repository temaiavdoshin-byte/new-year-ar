<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160d13">
<title>Магия искусства — AR 3.0 · Ночь</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;color:#fff;font-family:system-ui,-apple-system,sans-serif}
/* Camera handling is kept consistent with the user's previously working AR 2.0. */
body{background:transparent!important}
body>video,video{position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100dvh!important;object-fit:cover!important;z-index:0!important;opacity:1!important;visibility:visible!important}
a-scene,#ar-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;z-index:1!important;background:transparent!important}
a-scene canvas,canvas.a-canvas{background:transparent!important}
.a-enter-vr,.a-enter-ar,.a-orientation-modal{display:none!important}
#ui{position:fixed;inset:0;z-index:20;pointer-events:none}
#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:start}
#status{padding:10px 13px;max-width:76%;border:1px solid #e1b87d88;border-radius:16px;background:#251319d9;backdrop-filter:blur(12px);font-size:13px;transition:opacity .7s,transform .7s}
#status small{display:block;margin-top:4px;color:#f6d6af;font-size:11px}
#status.minimized{opacity:.63;transform:scale(.84);transform-origin:top left}
#status.minimized small{display:none}
button{pointer-events:auto;touch-action:manipulation;border-radius:12px;color:#fff;border:1px solid #e7b77c88;padding:11px 13px;background:#8f2930;font:inherit;cursor:pointer}
#bottom{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:14px;right:14px;display:grid;justify-items:center;gap:9px}
#hint{padding:10px 14px;max-width:420px;text-align:center;font-size:13px;background:#251319dc;border:1px solid #e1b87d88;border-radius:14px;transition:opacity .8s}
#hint.quiet{opacity:0}
#replay{display:none;padding:10px 15px;background:#782731ed;font-size:12px}
@media(prefers-reduced-motion:reduce){#status,#hint{transition:none}}
</style>
</head>
<body>
<a-scene id="ar-scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: no;" embedded color-space="sRGB" renderer="colorManagement: true; alpha: true; antialias: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="poster" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>
<div id="ui"><div id="top"><div id="status"><strong id="status-title">Подготовка AR…</strong><small id="status-detail">Проверяем камеру и маркер</small></div><button id="restart" type="button" aria-label="Перезапустить">↻</button></div>
<div id="bottom"><div id="hint">Наведите телефон на весь постер «Машина искусства»</div><button id="replay" type="button">✨ Повторить превращение</button></div></div>
<script>
(()=>{
'use strict';
const scene=document.getElementById('ar-scene'), poster=document.getElementById('poster');
const title=document.getElementById('status-title'),detail=document.getElementById('status-detail');
const hint=document.getElementById('hint'),replay=document.getElementById('replay'),status=document.getElementById('status');
const W=800,H=1313,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
const ctx=canvas.getContext('2d');
let texture,plane,tracking=false,start=0,lastFrame=0;
const setStatus=(a,b)=>{title.textContent=a;detail.textContent=b};
function fixVideo(){
 document.querySelectorAll('video').forEach(video=>{
  video.style.setProperty('z-index','0','important');video.style.setProperty('visibility','visible','important');video.style.setProperty('opacity','1','important');
 });
 if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);scene.renderer.domElement.style.setProperty('background','transparent','important')}
 if(scene.object3D)scene.object3D.background=null;
}
function initVisuals(){
 if(plane||!window.THREE)return;
 texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;texture.minFilter=THREE.LinearFilter;
 const material=new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false});
 plane=new THREE.Mesh(new THREE.PlaneGeometry(1,H/W),material);plane.position.z=.025;plane.renderOrder=10;poster.object3D.add(plane);
}
// Control points from AR 2.0; the artwork itself remains unchanged.
const trackPoints=[
 [426,227],[479,231],[549,255],[577,308],[553,357],[487,402],[400,430],[350,475],[338,522],[372,573],
 [459,621],[560,670],[611,726],[585,773],[515,815],[416,856],[316,908],[294,961],[346,1006],
 [432,1031],[530,1005],[607,968],[644,932],[624,980],[547,1031],[444,1063],[342,1074],
 [289,1090],[330,1126],[442,1138],[553,1131],[668,1129]
];
const pt=(x,y)=>[x/992*W,y/1537*H];
function catmull(a,b,c,d,u){return .5*((2*b)+(-a+c)*u+(2*a-5*b+4*c-d)*u*u+(-a+3*b-3*c+d)*u*u*u)}
const samples=[];let totalLength=0;
for(let i=0;i<trackPoints.length-1;i++)for(let j=0;j<18;j++){
 const u=j/18,A=trackPoints[Math.max(0,i-1)],B=trackPoints[i],C=trackPoints[i+1],D=trackPoints[Math.min(i+2,trackPoints.length-1)];
 const [x,y]=pt(catmull(A[0],B[0],C[0],D[0],u),catmull(A[1],B[1],C[1],D[1],u));
 if(samples.length){const p=samples[samples.length-1];totalLength+=Math.hypot(p.x-x,p.y-y)}samples.push({x,y,d:totalLength});
}
const last=pt(...trackPoints[trackPoints.length-1]);totalLength+=Math.hypot(last[0]-samples[samples.length-1].x,last[1]-samples[samples.length-1].y);samples.push({x:last[0],y:last[1],d:totalLength});
function path(u){const dist=Math.max(0,Math.min(1,u))*totalLength;let lo=0,hi=samples.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(samples[mid].d<dist)lo=mid+1;else hi=mid}if(!lo)return[samples[0].x,samples[0].y];const a=samples[lo-1],b=samples[lo],v=(dist-a.d)/Math.max(.00001,b.d-a.d);return[a.x+(b.x-a.x)*v,a.y+(b.y-a.y)*v]}
function glow(x,y,r,power,rgb='255,192,76'){
 const g=ctx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,'rgba(255,250,214,'+Math.min(1,power)+')');
 g.addColorStop(.25,'rgba('+rgb+','+Math.min(1,power*.62)+')');g.addColorStop(1,'rgba('+rgb+',0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fill();
}
function gear(x,y,r,angle,opacity){
 [x,y]=pt(x,y);r*=W/992;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha=Math.min(1,opacity);ctx.shadowColor='#ffc56c';ctx.shadowBlur=25;
 ctx.strokeStyle='#ffe0a1';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r,0,2*Math.PI);ctx.stroke();
 for(let i=0;i<12;i++){const a=i*Math.PI/6;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.85,Math.sin(a)*r*.85);ctx.lineTo(Math.cos(a)*r*1.2,Math.sin(a)*r*1.2);ctx.stroke()}
 ctx.restore();
}
function draw(now){
 if(!tracking||!texture)return;
 const t=(now-start)/1000,night=Math.min(1,Math.max(0,(t-.15)/3.8));
 const progress=t<12?Math.min(1,t/11.5):((t-12)*.044)%1;
 const burst=t>=10.5&&t<=13.5?Math.sin(Math.PI*(t-10.5)/3)**2:0;
 ctx.clearRect(0,0,W,H);
 // Evening-to-night transformation is confined to the tracked poster plane.
 // We use a translucent navy-indigo tint, not an opaque black rectangle.
 const shade=ctx.createLinearGradient(0,0,W,H);shade.addColorStop(0,'rgba(12,17,56,'+(.58*night)+')');shade.addColorStop(.56,'rgba(15,13,51,'+(.64*night)+')');shade.addColorStop(1,'rgba(7,11,36,'+(.70*night)+')');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
 // A deep violet twilight glow complements the existing red and gold artwork.
 if(night>.01){const g=ctx.createRadialGradient(W*.53,H*.38,20,W*.53,H*.38,W*.78);g.addColorStop(0,'rgba(75,46,100,'+(.10*night)+')');g.addColorStop(1,'rgba(28,19,68,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 ctx.globalCompositeOperation='screen';
 const brightness=.48+night*.9;
 ctx.save();ctx.lineWidth=2.7+night*1.6+burst*1.6;ctx.strokeStyle='rgba(255,191,83,'+Math.min(1,(.20+night*.27+burst*.25))+')';ctx.shadowBlur=12+night*23+burst*18;ctx.shadowColor='#ffd287';
 ctx.beginPath();samples.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
 const lit=t<12?Math.min(1,t/10.5):1;
 for(let i=0;i<104;i++){const u=i/103;if(u>lit)continue;const[x,y]=path(u),tw=.5+.5*Math.sin(t*4.2-i*.56);glow(x,y,11+11*tw+burst*12,(.16+.25*tw+burst*.2)*brightness);ctx.fillStyle='rgba(255,244,197,'+Math.min(1,.46+.5*tw+.12*night)+')';ctx.beginPath();ctx.arc(x,y,1.5+tw*1.7+night*.3,0,2*Math.PI);ctx.fill()}
 // Red orb and brighter comet tail.
 for(let i=17;i>=0;i--){const u=progress-i*.0037;if(u<0)continue;const[x,y]=path(u);glow(x,y,i===0?36:17,(.57-i*.025)*brightness,'255,94,48')}
 const[bx,by]=path(progress);ctx.save();ctx.shadowColor='#ffce6b';ctx.shadowBlur=20+night*20;ctx.fillStyle='#d52e24';ctx.beginPath();ctx.arc(bx,by,9.5,0,2*Math.PI);ctx.fill();ctx.fillStyle='#fff1be';ctx.beginPath();ctx.arc(bx-3,by-3,3.6,0,2*Math.PI);ctx.fill();ctx.restore();
 if(t>3){const a=Math.min(.85,(t-3)*.26)*(.75+night*.35+burst*.5);gear(465,1030,43,t*.42,a);gear(525,866,36,-t*.55,a)}
 // Art stations: theater, microphone, gallery, fashion, printing and film.
 const accents=[[296,375],[612,303],[698,685],[744,807],[645,1006],[363,565]];
 accents.forEach(([px,py],i)=>{if(t<3.4+i*.65)return;const[x,y]=pt(px,py),p=.5+.5*Math.sin(t*2.3+i);glow(x,y,43+19*p+burst*25,(.18+.22*p+burst*.23)*brightness)});
 // Starry specks are fixed to the poster so they do not float in screen space.
 for(let i=0;i<43;i++){const x=(Math.sin(i*73.1)*.5+.5)*W*.79+W*.1,y=(Math.sin(i*31.7)*.5+.5)*H*.7+H*.15,p=(1+Math.sin(t*2.6+i*1.9))*.5;if(t>1+i*.04)glow(x,y,7+11*p+burst*10,(.06+.17*p+burst*.12)*brightness)}
 if(burst){for(let i=0;i<50;i++){const[x,y]=path(i/49);glow(x,y,25+burst*34,burst*.38,'255,218,117')}const[x,y]=pt(490,720);glow(x,y,160+burst*200,burst*.18,'255,216,110')}
 ctx.globalCompositeOperation='source-over';texture.needsUpdate=true;
}
function loop(now){requestAnimationFrame(loop);if(now-lastFrame<33)return;lastFrame=now;draw(now)}
document.getElementById('restart').addEventListener('click',()=>location.reload());
replay.addEventListener('click',()=>{start=performance.now();hint.classList.remove('quiet');hint.textContent='Наступает волшебная ночь ✨';status.classList.remove('minimized')});
scene.addEventListener('renderstart',()=>{fixVideo();initVisuals()});
scene.addEventListener('arReady',()=>{fixVideo();initVisuals();if(!tracking)setStatus('Камера готова','Наведите её на новый постер')});
scene.addEventListener('arError',()=>setStatus('Ошибка AR','Проверьте разрешение камеры в Safari'));
poster.addEventListener('targetFound',()=>{tracking=true;start=performance.now();fixVideo();initVisuals();setStatus('Постер найден ✨','Наступает волшебная ночь');hint.textContent='Сумерки опускаются, огни загораются';hint.classList.remove('quiet');status.classList.remove('minimized');setTimeout(()=>{if(tracking){status.classList.add('minimized');hint.classList.add('quiet')}},3000);replay.style.display='block'});
poster.addEventListener('targetLost',()=>{tracking=false;setStatus('Ищем постер','Верните изображение в кадр');hint.textContent='Наведите камеру на весь постер';hint.classList.remove('quiet');status.classList.remove('minimized');replay.style.display='none'});
fetch('./targets.mind',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.arrayBuffer()}).then(buf=>{if(buf.byteLength<1000)throw Error('Некорректный маркер');if(!tracking)setStatus('Маркер загружен','Ожидаем камеру и изображение')}).catch(e=>setStatus('Ошибка targets.mind',String(e.message)));
requestAnimationFrame(loop);setTimeout(fixVideo,1300);setTimeout(fixVideo,3500);
})();
</script>
</body>
</html>
